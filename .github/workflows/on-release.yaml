name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: write
  deployments: write
  id-token: write
  pull-requests: write

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    environment: Publishing
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: 'pnpm'
          cache-dependency-path: 'pnpm-lock.yaml'

      - run: pnpm install --frozen-lockfile

      # v2 is the line that supports @changesets/cli v3 (v1 targets cli v2).
      # It reads the token from `github-token`, which defaults to GITHUB_TOKEN.
      - uses: changesets/action@v2
        with:
          publish-script: pnpm changeset:publish
          version-script: pnpm changeset:version
          commit-message: 'chore(release): update version for release'
          pr-title: 'chore(release): update version for release'
